  #       condition: service_healthy
  #   restart: unless-stopped
  #   command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
  
  postgres:
      image: postgres:17
      container_name: marketplace_db
      env_file: 
        .env.dev
      ports:
        - "6432:5432"  
      volumes:
        - marketplace_data:/var/lib/postgresql/data
      networks:
        - marketplace_network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

  redis:
    image: redis:7
    container_name: marketplace_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - marketplace_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3  
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning    


  redis_gui:
    image: redis/redisinsight
    ports:
      - 5540:5540
    networks:
      - marketplace_network

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
      - "9090:9090"
    networks:
      - marketplace_network


  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    networks:
      - marketplace_network


volumes:
  marketplace_data:
  redis_data:

networks:
  marketplace_network:
    driver: bridge      