name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_VERSION: "17"
  REDIS_VERSION: "7"
  RABBITMQ_VERSION: "4.1.1-management-alpine"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:4.1.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --dev

      - name: Prepare .env.test file for CI
        run: |
          if [ -f .env.test ]; then
            echo "Using existing .env.test file"
          else
            echo "Creating .env.test for CI environment"
            if [ -f .env.test.example ]; then
              cp .env.test.example .env.test
              # Заменяем значения на CI-дружественные
              sed -i 's/ENVIRONMENT=.*/ENVIRONMENT=test/' .env.test
              sed -i 's/DB_USER=.*/DB_USER=postgres/' .env.test
              sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.test
              sed -i 's/DB_HOST=.*/DB_HOST=localhost/' .env.test
              sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.test
              sed -i 's/DB_NAME=.*/DB_NAME=marketplace_test/' .env.test
              sed -i 's/SECRET_KEY = .*/SECRET_KEY = test_secret_key/' .env.test
              sed -i 's/ALGORITHM = .*/ALGORITHM = HS256/' .env.test
              sed -i 's/REDIS_HOST = .*/REDIS_HOST = localhost/' .env.test
              sed -i 's/REDIS_PORT = .*/REDIS_PORT = 6379/' .env.test
              sed -i 's/RABBITMQ_DEFAULT_USER=.*/RABBITMQ_DEFAULT_USER=guest/' .env.test
              sed -i 's/RABBITMQ_DEFAULT_PASS=.*/RABBITMQ_DEFAULT_PASS=guest/' .env.test
              sed -i 's/RABBITMQ_DEFAULT_HOST=.*/RABBITMQ_DEFAULT_HOST=localhost/' .env.test
              sed -i 's/RABBITMQ_DEFAULT_PORT=.*/RABBITMQ_DEFAULT_PORT=5672/' .env.test
              sed -i 's/MailDEV_HOST=.*/MailDEV_HOST=localhost/' .env.test
              sed -i 's/authentication_backend_secret_key=.*/authentication_backend_secret_key=test_admin_secret/' .env.test
            else
              # Если примера нет, создаём минимальный .env.test построчно
              echo "ENVIRONMENT=test" > .env.test
              echo "DB_DRIVER=postgresql+asyncpg" >> .env.test
              echo "DB_USER=postgres" >> .env.test
              echo "DB_PASSWORD=postgres" >> .env.test
              echo "DB_HOST=localhost" >> .env.test
              echo "DB_PORT=5432" >> .env.test
              echo "DB_NAME=marketplace_test" >> .env.test
              echo "SECRET_KEY=test_secret_key" >> .env.test
              echo "ALGORITHM=HS256" >> .env.test
              echo "REDIS_HOST=localhost" >> .env.test
              echo "REDIS_PORT=6379" >> .env.test
              echo "RABBITMQ_DEFAULT_USER=guest" >> .env.test
              echo "RABBITMQ_DEFAULT_PASS=guest" >> .env.test
              echo "RABBITMQ_DEFAULT_HOST=localhost" >> .env.test
              echo "RABBITMQ_DEFAULT_PORT=5672" >> .env.test
              echo "MailDEV_HOST=localhost" >> .env.test
              echo "authentication_backend_secret_key=test_admin_secret" >> .env.test
            fi
          fi

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t marketplace:ci .